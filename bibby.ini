# bibby — brew controller configuration
#
# Key parameters another person or another brew setup would need to change.
# The controller reads this file once at startup. Edit values here; no rebuild
# is required. Every runtime parameter lives in this file — nothing worth
# changing is a constant in the source.
#
# Lookup order: -c <path> argument, then $BIBBY_CONFIG, then bibby.ini next to
# the executable, then bibby.ini in the current directory. A missing file or an
# unrecognized key falls back to the built-in default shown for each key below,
# so the controller always comes up.
#
# Comments start with '#' or ';' and may follow a value on the same line.
# Full key reference: README §7. Calibration procedures: README §9.

[mains]
# AC line frequency. 60 = North America, 50 = most of the rest of the world.
# Sets the zero-cross watchdog timeout (half-period + 0.7 ms guard), the
# control-staleness cutoff (2 x Hz zero crossings, ~2 s), and the MAX31865
# noise-rejection notch.
# default: 60
frequency_hz = 60

[element1]
# SSR1 heating element (GPIO21 / pin 40).
# defaults: watts = 2500, area_cm2 = 150
watts    = 5000    ; rated electrical power, W
area_cm2 = 820     ; wetted surface area, cm^2 (drives the equal-flux split)

[element2]
# SSR2 heating element (GPIO26 / pin 37).
watts    = 5500
area_cm2 = 473

[power]
# Anti-scorch cap on surface power density. When > 0, total demand is capped at
# max_flux_w_cm2 * (area1 + area2); the equal-flux split then keeps both
# elements at that same flux. 0 disables the cap, so the only ceiling is the
# summed element rating (10500 W here).
# default: 0
max_flux_w_cm2 = 0

[pid]
# Temperature-loop gains. The control law works in WATTS: kp is W/degC, and the
# output (feedforward + P + I + D, clamped to [0, max power]) is a power demand
# that the equal-flux split turns into per-element duty. ki and kd are discrete
# per-sample gains, already folded with the sample period by
# tools/identify_plant.py — the sample clock is the MAX31865 conversion rate
# (~50/60 Hz). Zero gains mean auto mode commands no power; tune before use.
# defaults: kp = 0, ki = 0, kd = 0
#
# IMC-PI starting gains from the 2026-06-20 open-loop step tests
# (tools/identify_plant.py, 5000+5500 W elements, ~15 L test volume,
# mc ~= 62 kJ/degC). Validate with a setpoint step (README §9.5) and
# re-identify on the real brew setup before trusting a full batch.
kp = 715.0
ki = 0.054
kd = 0.0

[grain]
# Alternate gain set used while the "Grain In" toggle is on — the loaded mash
# is a slower, better-mixed plant than plain water, so it usually wants softer
# gains than [pid]. Leaving these at 0 makes Grain In command no power in auto,
# so set them (or stay in manual with grain in) before relying on the toggle.
# max_power_w additionally caps total demand while grain is in, to protect the
# bag and avoid scorching against a static grain bed; 0 = no extra cap.
# defaults: kp = 0, ki = 0, kd = 0, max_power_w = 0
kp          = 0.0
ki          = 0.0
kd          = 0.0
max_power_w = 0

[feedforward]
# Holding feedforward: the steady-state power needed to hold the setpoint is added
# ahead of the PID, so the feedback only has to trim model error. See README §9.6.
#   ff_watts = (setpoint - ambient_c) / process_gain_c   (clamped to [0, max power])
#
# process_gain_c — the identified process gain K (deg C per WATT),
#   printed by tools/identify_plant.py from an open-loop step test (README §9.4).
#   Leaving it at 0 DISABLES feedforward (safe default); the PID then supplies
#   all holding power as before.
# ambient_c — ambient / cold-start reference temperature (deg C). Use the kettle
#   temperature before heating; identify_plant.py prints a suggested value.
# defaults: process_gain_c = 0, ambient_c = 20
process_gain_c = 0.0
ambient_c      = 20.0

[sensor]
# Per-unit RTD calibration. These depend on the specific PT100 probe and the
# MAX31865 reference resistor, so they MUST be re-derived for any other board
# or probe (README §9 walks through the procedure). Leaving them at the
# identity defaults below gives an uncalibrated sensor.
#   defaults: ref_resistor_ohms = 400, temp_cal_gain = 1.0, temp_cal_offset = 0.0
#
# ref_resistor_ohms — MAX31865 Rref, ice-point trimmed (README §9.1).
#   The driver computes R_rtd = (raw / 32768) * Rref, so Rref scales the whole
#   resistance reading. Start from the board's nominal reference (400 Ohm here),
#   read the probe in a 0 C ice bath, and trim so it reads exactly 0 C:
#     Rref = Rref_nominal * 100.0 / R_pt100(T_ice_measured)
#   This unit read +1.4 C at the ice point, R_pt100(1.4) = 100.547 Ohm:
#     Rref = 400 * 100.0 / 100.547 = 397.82
ref_resistor_ohms = 397.82
#
# temp_cal_gain / temp_cal_offset — two-point span trim (README §9.2).
#   Applied as T_true = temp_cal_gain * T_measured + temp_cal_offset on the
#   Callendar–Van Dusen output, AFTER the Rref trim above. Take two reference
#   points (T1_ref, T1_meas) and (T2_ref, T2_meas):
#     temp_cal_gain   = (T2_ref - T1_ref) / (T2_meas - T1_meas)
#     temp_cal_offset = T1_ref - temp_cal_gain * T1_meas
#   This unit used the ice point (0.000 ref / 0.000 meas after the Rref trim)
#   and a fan-mixed ambient point (25.00 ref / 23.78 meas):
#     gain   = (25.00 - 0.0) / (23.78 - 0.0) = 1.0513   (tuned to 1.0528)
#     offset = 0.0 - 1.0528 * 0.0            = -0.032
#   PROVISIONAL: both points are <= 25 C. Confirm against a boiling-point
#   reference (corrected for your altitude) before trusting brew-range temps.
temp_cal_gain   = 1.0528
temp_cal_offset = -0.032

[filter]
# Cascaded boxcar temperature filter: `order` identical stages of `window`
# samples each, run at the sensor's conversion rate. Order 2 gives triangular
# weighting. More smoothing costs phase: group delay is
# order * (window - 1) / 2 samples (2 x 40 at 60 Hz ~= 0.65 s), which becomes
# dead time the tuning has to absorb — re-identify after changing these.
# Order is clamped to 1..4.
# defaults: order = 2, window = 40
order  = 2
window = 40

[logging]
# CSV logging under ~/bibby/logs/YYYY/MM/DD/HH-MM-SS.csv, one file per run.
# rate = high  -> one row per fresh sample (~50/60 Hz); what the tuning tools
#                 in tools/ expect, and a few MB per brew.
# rate = low   -> one row per low_period_s seconds, same columns.
# defaults: rate = high, low_period_s = 2.0
rate         = high
low_period_s = 2.0

[ui]
# show_zc_sim   — show the ZC Sim toggle, which fakes zero crossings so the
#                 whole loop can run on the bench with no AC connected. Set
#                 false on a finished panel so nobody can arm it mid-brew.
# chart_window_min — scrolling chart span in minutes, clamped to 1..30.
# rotation      — UI rotation onto the sideways-mounted panel: 0/90/180/270.
# fb_device     — framebuffer, or "auto" for /dev/fb0.
# touch_device  — evdev node, or "auto" to probe for the first multitouch device.
# defaults: show_zc_sim = true, chart_window_min = 5, rotation = 90,
#           fb_device = auto, touch_device = auto
show_zc_sim      = true
chart_window_min = 5
rotation         = 90
fb_device        = auto
touch_device     = auto

[adaptive]
# Online thermal-mass gain scheduling. The controller always estimates m*c from
# the temperature rise under known power (it is logged as mc_est_j_per_c and
# shown on the status line, ~4.19 kJ/degC per liter of water), but only uses it
# when enable = true: kp and kd are then scaled by
# mc_est / mc_ref_j_per_c, clamped to [scale_min, scale_max].
#
# mc_ref_j_per_c is the batch the gains in [pid] were tuned at — with enable on
# and mc_ref at 0 the scale stays 1.0, so set it before enabling. Half batches
# then get proportionally softer gains, double batches stiffer.
# defaults: enable = false, mc_ref_j_per_c = 0, scale_min = 0.5, scale_max = 4.0
enable         = false
mc_ref_j_per_c = 0
scale_min      = 0.5
scale_max      = 4.0
