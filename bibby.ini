# bibby — brew controller configuration
#
# Key parameters another person or another brew setup would need to change.
# The controller reads this file once at startup. Edit values here; no rebuild
# is required. Every runtime parameter lives in this file — nothing worth
# changing is a constant in the source.
#
# Lookup order: -c <path> argument, then $BIBBY_CONFIG, then bibby.ini next to
# the executable, then bibby.ini in the current directory. A missing file or an
# unrecognized key falls back to the built-in default shown for each key below,
# so the controller always comes up.
#
# Comments start with '#' or ';' and may follow a value on the same line.
# Full key reference: README §7. Calibration procedures: README §9.

[mains]
# AC line frequency. 60 = North America, 50 = most of the rest of the world.
# Sets the zero-cross watchdog timeout (half-period + 0.7 ms guard), the
# control-staleness cutoff (2 x Hz zero crossings, ~2 s), and the MAX31865
# noise-rejection notch.
# default: 60
frequency_hz = 60

[element1]
# SSR1 heating element (GPIO21 / pin 40).
# defaults: watts = 2500, area_cm2 = 150
watts    = 5000    ; rated electrical power, W
area_cm2 = 820     ; wetted surface area, cm^2 (drives the equal-flux split)

[element2]
# SSR2 heating element (GPIO26 / pin 37).
watts    = 5500
area_cm2 = 473

[power]
# Anti-scorch cap on surface power density. When > 0, total demand is capped at
# max_flux_w_cm2 * (area1 + area2); the equal-flux split then keeps both
# elements at that same flux. 0 disables the cap, so the only ceiling is the
# summed element rating (10500 W here).
# default: 0
max_flux_w_cm2 = 0

[pid]
# Temperature-loop gains. The control law works in WATTS: kp is W/degC, and the
# output (feedforward + P + I + D, clamped to [0, max power]) is a power demand
# that the equal-flux split turns into per-element duty. ki and kd are discrete
# per-sample gains, already folded with the sample period by
# tools/identify_plant.py — the sample clock is the MAX31865 conversion rate
# (~50/60 Hz). Zero gains mean auto mode commands no power; tune before use.
# defaults: kp = 0, ki = 0, kd = 0
#
# SIMC-PI gains from the 2026-09-07 heat/cool test, water only (no grain):
#   tools/identify_plant.py logs/2026/09/07/15-41-11.csv --ambient 32.75 \
#       --volume-l 45 --lambda 30
#   m = 53.2 L water-equivalent (45 L actually in the kettle), k_loss = 9.7
#   W/degC, L = 9.5 s (power-on corner), tau_c = 30 s, Ti = 158 s. The first
#   pass used the script's default tau_c = 120 s (kp = 1718, ki = 0.056): the
#   2026-09-07 ramp test showed that to be gentle (a 2 degC step took 4 min to
#   first reach setpoint) and still overshooting (0.26 degC on a 2 degC step,
#   0.73 degC on 10 degC) because the integrator accumulated during the long
#   unsaturated approach. tau_c = 30 s makes P saturate above ~1.9 degC of
#   error and, with i_band_c below, keeps the integrator out of the approach.
#   README §9.5 explains tau_c (--lambda).
#   5000+5500 W nominal elements that delivered ~85 % of that (mains below the
#   240 V rating). The controller, the log, and the identification all work in
#   the same nominal watts, so the loop is correctly tuned as-is — the 85 %
#   cancels. Only the displayed watts, the batch-size readout and the flux cap
#   are mislabeled (that is why m reads 53 L for 45 L of water). If [element*]
#   watts are ever corrected by a factor s, scale kp and ki by s and
#   feedforward.process_gain_c by 1/s (or re-identify); changing the ratings
#   alone makes the loop 1/s more aggressive. Validate with a setpoint step
#   (README §9.5) before trusting a batch.
kp = 5632.60
ki = 0.606039
kd = 0.0

# Integral separation. The integrator only accumulates while |setpoint - temp|
# is within this many degC; outside the band it holds its value (no growth,
# no reset). The kettle is an integrating plant, so every degree-second of
# error the integrator soaks up on the way to setpoint has to be paid back as
# overshoot after the crossing — in the 2026-09-07 ramp test that was the
# whole 0.73 degC. The feedforward carries the holding power, so the
# integrator only has model error to trim once the loop is close. Applies in
# both the [pid] and [grain] gain sets. 0 = integrate always (classic PI).
# default: 0
i_band_c = 0.5

[grain]
# Alternate gain set used while the "Grain In" toggle is on — the loaded mash
# is a slower, better-mixed plant than plain water, so it usually wants softer
# gains than [pid]. Leaving these at 0 makes Grain In command no power in auto,
# so set them (or stay in manual with grain in) before relying on the toggle.
# max_power_w additionally caps total demand while grain is in, to protect the
# bag and avoid scorching against a static grain bed; 0 = no extra cap.
# defaults: kp = 0, ki = 0, kd = 0, max_power_w = 0
kp          = 0.0
ki          = 0.0
kd          = 0.0
max_power_w = 0

[feedforward]
# Holding feedforward: the steady-state power needed to hold the setpoint is added
# ahead of the PID, so the feedback only has to trim model error. See README §9.6.
#   ff_watts = (setpoint - ambient_c) / process_gain_c   (clamped to [0, max power])
#
# process_gain_c — the identified process gain K = 1/k_loss (deg C per WATT),
#   printed by tools/identify_plant.py from a heat/cool test (README §9.4).
#   Leaving it at 0 DISABLES feedforward (safe default); the PID then supplies
#   all holding power as before.
# ambient_c — room temperature the kettle loses heat to (deg C): the value you
#   measured and passed to identify_plant.py as --ambient.
# defaults: process_gain_c = 0, ambient_c = 20
#
# From the same 2026-09-07 heat/cool test as [pid]: K = 1/9.73 W/degC, room at
# 32.75 degC. Holding power at 67 degC works out to ~330 W (nominal watts).
# The cooling phase was short, so k_loss and ambient trade off against each
# other; the holding power near mash temperature is what the data pin down,
# and the integrator trims the rest.
process_gain_c = 0.102810
ambient_c      = 32.75

[sensor]
# Per-unit RTD calibration. These depend on the specific PT100 probe and the
# MAX31865 reference resistor, so they MUST be re-derived for any other board
# or probe (README §9 walks through the procedure). Leaving them at the
# identity defaults below gives an uncalibrated sensor.
#   defaults: ref_resistor_ohms = 400, temp_cal_gain = 1.0, temp_cal_offset = 0.0
#
# ref_resistor_ohms — MAX31865 Rref, ice-point trimmed (README §9.1).
#   The driver computes R_rtd = (raw / 32768) * Rref, so Rref scales the whole
#   resistance reading. Start from the board's nominal reference (400 Ohm here),
#   read the probe in a 0 C ice bath, and trim so it reads exactly 0 C:
#     Rref = Rref_nominal * 100.0 / R_pt100(T_ice_measured)
#   This unit read +1.4 C at the ice point, R_pt100(1.4) = 100.547 Ohm:
#     Rref = 400 * 100.0 / 100.547 = 397.82
ref_resistor_ohms = 400.00
; ref_resistor_ohms = 397.82
#
# temp_cal_gain / temp_cal_offset — two-point span trim (README §9.2).
#   Applied as T_true = temp_cal_gain * T_measured + temp_cal_offset on the
#   Callendar–Van Dusen output, AFTER the Rref trim above. Take two reference
#   points (T1_ref, T1_meas) and (T2_ref, T2_meas):
#     temp_cal_gain   = (T2_ref - T1_ref) / (T2_meas - T1_meas)
#     temp_cal_offset = T1_ref - temp_cal_gain * T1_meas
#   This unit used the ice point (0.000 ref / 0.000 meas after the Rref trim)
#   and a fan-mixed ambient point (25.00 ref / 23.78 meas):
#     gain   = (25.00 - 0.0) / (23.78 - 0.0) = 1.0513   (tuned to 1.0528)
#     offset = 0.0 - 1.0528 * 0.0            = -0.032
#   PROVISIONAL: both points are <= 25 C. Confirm against a boiling-point
#   reference (corrected for your altitude) before trusting brew-range temps.
temp_cal_gain   = 1.0
temp_cal_offset = -0.4
; temp_cal_gain   = 1.0528
; temp_cal_offset = -0.032

[filter]
# Cascaded boxcar temperature filter: `order` identical stages of `window`
# samples each, run at the sensor's conversion rate. Order 2 gives triangular
# weighting. More smoothing costs phase: group delay is
# order * (window - 1) / 2 samples (2 x 40 at 60 Hz ~= 0.65 s), which becomes
# dead time the tuning has to absorb — re-identify after changing these.
# Order is clamped to 1..4.
# defaults: order = 2, window = 40
order  = 2
window = 40

[logging]
# CSV logging under ~/bibby/logs/YYYY/MM/DD/HH-MM-SS.csv, one file per run.
# rate = high  -> one row per fresh sample (~50/60 Hz); what the tuning tools
#                 in tools/ expect, and about 35MB per hour.
# rate = low   -> one row per low_period_s seconds, same columns.
# defaults: rate = high, low_period_s = 2.0
rate         = high
low_period_s = 2.0

[ui]
# show_zc_sim   — show the ZC Sim toggle, which fakes zero crossings so the
#                 whole loop can run on the bench with no AC connected. Set
#                 false on a finished panel so nobody can arm it mid-brew.
# chart_window_min — scrolling chart span in minutes, clamped to 1..30.
# rotation      — UI rotation onto the sideways-mounted panel: 0/90/180/270.
# fb_device     — framebuffer, or "auto" for /dev/fb0.
# touch_device  — evdev node, or "auto" to probe for the first multitouch device.
# defaults: show_zc_sim = true, chart_window_min = 5, rotation = 90,
#           fb_device = auto, touch_device = auto
show_zc_sim      = true
chart_window_min = 5
rotation         = 90
fb_device        = auto
touch_device     = auto

[web]
# Optional web interface on the LAN: a live mirror of the touchscreen that can
# be tapped from a phone or laptop, plus a browser for the CSV run logs
# (graphs, and download). README section 8 covers it.
#
# SAFETY. This puts the kettle controls on your network. The mirror injects
# taps as pointer events into the same UI a finger drives, so every interlock
# still applies — but anyone who reaches this port and knows the password can
# raise the setpoint or command power on a 10.5 kW kettle. Keep it on a trusted
# home network, use a password you do not use elsewhere, and do not forward the
# port through your router. Traffic is plain HTTP: the password is readable by
# anyone who can watch the network, so treat it as protection against the
# household, not against an attacker on the wire.
#
# enable        — start the server. Ignored unless password is also set.
# port          — TCP port to listen on.
# bind          — 0.0.0.0 serves the whole LAN; 127.0.0.1 restricts it to the
#                 Pi itself (reachable only over an ssh tunnel).
# user/password — HTTP Basic credentials. The server REFUSES to start with an
#                 empty password, so an unconfigured unit is never exposed.
#                 The INI parser treats '#' and ';' as comment starts, so the
#                 password may not contain either character.
# allow_control — false serves a read-only mirror: the screen still updates,
#                 but taps are rejected. Set false to check on a brew from the
#                 couch without being able to change it by accident.
# screen_fps    — cap on how often the mirror re-reads the panel (1..30). The
#                 server only captures while a browser is watching, and only
#                 sends a frame when the screen actually changed.
# defaults: enable = false, port = 8080, bind = 0.0.0.0, user = brewer,
#           password = (empty), allow_control = true, screen_fps = 5
enable        = true
port          = 8080
bind          = 0.0.0.0
user          = brewer
password      = test
allow_control = true
screen_fps    = 10

[adaptive]
# Online batch-size gain scheduling. The controller always estimates the batch
# size m, in litres of water, from the temperature rise under known power (it
# is logged as m_est_l and shown on the status line as "m xx.x L"), but only
# uses it when enable = true: kp and kd are then scaled by m_est / m_ref_l,
# clamped to [scale_min, scale_max].
#
# m_ref_l is the batch the gains in [pid] were tuned at, AS THE ESTIMATOR
# READS IT (the identification prints it): the estimate counts the kettle and
# hoses as water and reads 1/0.85 high when the elements deliver 85 % of their
# rated watts, so it is not exactly the litres poured in. With enable on and
# m_ref_l at 0 the scale stays 1.0, so set it before enabling. Half batches
# then get proportionally softer gains, double batches stiffer.
# defaults: enable = false, m_ref_l = 0, scale_min = 0.5, scale_max = 4.0
enable         = false
m_ref_l        = 53.2      ; batch the [pid] gains were tuned at as the estimator reads it (45 L poured, 2026-09-07)
scale_min      = 0.5
scale_max      = 4.0
